apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite — never run two pods at once
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      enableServiceLinks: false
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.21.0
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: BASE_URL
              value: https://mealie.k8s.hyperion.internal
            - name: ALLOW_SIGNUP
              value: "false"
            - name: TZ
              value: Europe/Warsaw
          volumeMounts:
            - name: data
              mountPath: /app/data
          startupProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data

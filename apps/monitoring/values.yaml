fullnameOverride: kps
defaultRules:
  node:
    # Nix bind-mounts /nix/store from /; do not alert twice on the SSD.
    fsSelector: 'fstype!~"|tmpfs|ramfs|overlay|squashfs",mountpoint!="/nix/store"'
  disabled:
    # Replaced below with physical-disk thresholds and storage-class-aware PVC rules.
    NodeFilesystemSpaceFillingUp: true
    NodeFilesystemAlmostOutOfSpace: true
    KubePersistentVolumeFillingUp: true
    KubePersistentVolumeInodesFillingUp: true
prometheus:
  prometheusSpec:
    externalUrl: https://prometheus.k8s.hyperion.internal
    retention: 30d
    retentionSize: "18GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi
    # Scrape any ServiceMonitor / PodMonitor / PrometheusRule in any namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
grafana:
  defaultDashboardsEnabled: false
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  defaultDashboardsTimezone: Europe/Warsaw
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
  grafana.ini:
    server:
      root_url: "http://grafana.k8s.hyperion.internal"
      domain: grafana.k8s.hyperion.internal
    analytics:
      reporting_enabled: false
      check_for_updates: false
  initChownData:
    enabled: false
  securityContext:
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
alertmanager:
  enabled: true
  alertmanagerSpec:
    externalUrl: https://alertmanager.k8s.hyperion.internal
    replicas: 1
    retention: 120h
    useExistingSecret: true
    configSecret: alertmanager-config
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
nodeExporter:
  enabled: true
prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
kube-state-metrics:
  enabled: true
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
